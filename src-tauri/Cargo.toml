[package]
name = "inkwell"
version = "0.1.0"
description = "A lightweight, cross-platform markdown editor"
authors = ["Justin Sise"]
edition = "2021"
rust-version = "1.77"

# The library that both desktop (main.rs) and mobile entry points call into.
[lib]
name = "inkwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
